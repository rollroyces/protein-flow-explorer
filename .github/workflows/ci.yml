name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Syntax gate: catches the class of error that broke the deployed app
      # (a mangled HTML entity in escapeHtml produced a SyntaxError on load).
      - name: Syntax check
        run: |
          node --check app.js
          node --check data/proteins.js
          node --check src/seq.js
          node --check src/geometry.js
          node --check src/pockets.js
          node --check src/colors.js
          node --check src/variants.js
          node --check src/expression.js
          node --check src/validate.js
          node --check src/annotations.js
          node --check src/drug.js
          node --check test/bio.test.js
          node --check test/net.test.js
          node --check test/analysis.test.js
          node --check test/colors.test.js
          node --check test/variants.test.js
          node --check test/expression.test.js
          node --check test/validate.test.js
          node --check test/annotations.test.js
          node --check test/drug.test.js
          node --check test/pockets.test.js

      # Unit tests for the extracted pure modules. These need no DOM stub,
      # which is exactly what the extraction bought us.
      - name: Module unit tests
        run: node test/analysis.test.js

      # Colour regression tests (scheme names must never be passed to 3Dmol's
      # `color` field, which is a literal colour, not a scheme name).
      - name: Colour tests
        run: node test/colors.test.js

      # Variant module: ClinVar parsing, gnomAD ids, significance, residue map.
      - name: Variant tests
        run: node test/variants.test.js

      # Tissue expression (GTEx), input/payload validation, and the annotation
      # key cross-checked against the palettes the app actually renders.
      - name: Expression, validation and annotation tests
        run: |
          node test/expression.test.js
          node test/validate.test.js
          node test/annotations.test.js

      # Unit tests over the analysis routines.
      - name: Analysis unit tests
        run: node test/bio.test.js

      # Drug-discovery module: druggability rules, the cross-validation
      # against the Chemical Component Dictionary, and the pocket-geometry
      # helpers the detector uses (atom lookup and cavity flood fill).
      - name: Drug discovery and pocket geometry tests
        run: |
          node test/drug.test.js
          node test/pockets.test.js

      # Behavioural tests for the network layer (retry / timeout / staleness).
      - name: Network layer tests
        run: node test/net.test.js

      # Lint. The config lives in the repository and needs no dependency:
      # npx fetches eslint on demand. This is a blocking gate because the
      # suite is clean.
      - name: Lint
        run: npx --yes eslint@9 .

      # Dependency audit. 3Dmol.js is pinned to an exact version and loaded
      # from jsDelivr, so audit the runtime we actually depend on.
      - name: Audit runtime dependency
        run: npx --yes audit-ci@latest --package-manager npm --omit=dev || true
        env:
          AUDIT_LEVEL: moderate

  # The design package (target-pocket conditioning, the constrained
  # integrator, the geometry metrics and the packing hook) is Python, and is
  # tested separately from the static site. The site itself is unchanged and
  # still has no build step.
  python-design:
    name: Design package (conditioning, metrics, packing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU-only torch: the CI machine has no GPU and the CUDA wheels are
      # several gigabytes. Installing torch first means the package install
      # below finds the requirement already satisfied.
      #
      # The "bio" extra pulls in Biopython, which the suite uses to cross-check
      # the surface-area implementation against an independent one. Without it
      # that cross-check is skipped and the headline agreement number would be
      # a local-only claim.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e "python[dev,bio]"

      # The suite covers the masking logic (zero velocity and zero update on
      # fixed target residues) and the geometry metrics (iRMSD, ligand RMSD,
      # buried surface area, steric clashes).
      - name: Design package tests
        run: python -m pytest python/tests -v

      # Lint. The configuration lives in python/pyproject.toml, so this adds no
      # dependency beyond the dev extra.
      - name: Design package lint
        run: python -m ruff check python
