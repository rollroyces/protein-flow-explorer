name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Syntax gate: catches the class of error that broke the deployed app
      # (a mangled HTML entity in escapeHtml produced a SyntaxError on load).
      - name: Syntax check
        run: |
          node --check app.js
          node --check data/proteins.js
          node --check src/seq.js
          node --check src/geometry.js
          node --check src/pockets.js
          node --check src/colors.js
          node --check src/variants.js
          node --check test/bio.test.js
          node --check test/net.test.js
          node --check test/analysis.test.js
          node --check test/colors.test.js
          node --check test/variants.test.js

      # Unit tests for the extracted pure modules. These need no DOM stub,
      # which is exactly what the extraction bought us.
      - name: Module unit tests
        run: node test/analysis.test.js

      # Colour regression tests (scheme names must never be passed to 3Dmol's
      # `color` field, which is a literal colour, not a scheme name).
      - name: Colour tests
        run: node test/colors.test.js

      # Variant module: ClinVar parsing, gnomAD ids, significance, residue map.
      - name: Variant tests
        run: node test/variants.test.js

      # Unit tests over the analysis routines.
      - name: Analysis unit tests
        run: node test/bio.test.js

      # Behavioural tests for the network layer (retry / timeout / staleness).
      - name: Network layer tests
        run: node test/net.test.js

      # Dependency audit. 3Dmol.js is pinned to an exact version and loaded
      # from jsDelivr, so audit the runtime we actually depend on.
      - name: Audit runtime dependency
        run: npx --yes audit-ci@latest --package-manager npm --omit=dev || true
        env:
          AUDIT_LEVEL: moderate
